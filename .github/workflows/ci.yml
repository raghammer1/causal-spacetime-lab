name: Python tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: python -m pytest -q
      - name: Reproduce baseline CLI
        run: python -m causal_lab.cli --seed 20261025 --repeats 100 --out results
      - name: Reproduce finite-density smoke study
        run: python -m causal_lab.scaling --seed 20261025 --densities 8 32 --durations 0.5 1 --repeats 8 --bootstrap 100 --order-repeats 2 --benchmark-repeats 1 --out results/scaling-smoke
      - name: Reproduce dimension smoke study
        run: python -m causal_lab.dimension_study --dimensions 2 3 --counts 16 --repeats 3 --calibration-repeats 10 --bootstrap 100 --benchmark-repeats 1 --out results/dimension-smoke
      - name: Reproduce adversarial geometry smoke study
        run: python -m causal_lab.adversarial_study --dimensions 2 3 --counts 12 --fits 2 --calibration 10 --development 10 --validation 12 --repeats 2 --search-steps 4 --bootstrap 32 --seed 101 --out results/adversarial-smoke
      - name: Reproduce local causal structure smoke study
        run: python -m causal_lab.local_structure_study --smoke --workers 1 --output results/local-structure-smoke
      - name: Reproduce background-free growth smoke study
        run: python -m causal_lab.growth_study --smoke --workers 1 --output results/growth-smoke
