name: Research atlas
on:
  push:
    branches: [main, feature/interactive-research-atlas-v1]
    paths: ['apps/research-atlas/**', '.github/workflows/research-atlas.yml']
  pull_request:
    paths: ['apps/research-atlas/**', '.github/workflows/research-atlas.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: atlas-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/research-atlas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/research-atlas/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run data:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Preserve browser reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-browser-results
          path: |
            apps/research-atlas/playwright-report
            apps/research-atlas/test-results
          retention-days: 14
      - name: Upload verified Pages build
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/research-atlas/dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy verified build
        id: deployment
        uses: actions/deploy-pages@v4
